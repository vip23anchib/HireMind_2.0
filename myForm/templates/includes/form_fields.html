<form id="userForm"
          action="{% url 'contact_form' %}"
          method="POST"
          enctype="multipart/form-data">

      {% csrf_token %}

      {% if data %}
      <input type="hidden"
             name="record_id"
             value="{{ data.id }}">
      {% endif %}


    {% if job %}

    <input type="hidden"
        name="job_id"
        value="{{ job.id }}">

    {% endif %}


      <!-- NAME -->

      <div class="form-group">

        <label>Name</label>

        <input type="text"
               name="name"
               value="{{ data.name }}"
               required>

      </div>

      <!-- EMAIL -->

      <div class="form-group">

        <label>Email</label>

        <input type="email"
               name="email"
               value="{{ data.email }}"
               required>

      </div>

      <!-- PHONE -->

      <div class="form-group">

        <label>Phone Number</label>

        <input type="text"
               name="phone_number"
               value="{{ data.phone_number }}"
               required>

      </div>

      <!-- GENDER -->

      <div class="form-group">

        <label>Gender</label>

        <div class="inline">

          <label>
            <input type="radio"
                   name="gender"
                   value="Male"
                   {% if data.gender == "Male" %}checked{% endif %}>
            Male
          </label>

          <label>
            <input type="radio"
                   name="gender"
                   value="Female"
                   {% if data.gender == "Female" %}checked{% endif %}>
            Female
          </label>

          <label>
            <input type="radio"
                   name="gender"
                   value="Other"
                   {% if data.gender == "Other" %}checked{% endif %}>
            Other
          </label>

        </div>

      </div>

      <!-- COUNTRY -->

      <div class="form-group">

        <label>Country</label>

        <select name="country">

          <option value="India"
            {% if data.country == "India" %}selected{% endif %}>
            India
          </option>

          <option value="USA"
            {% if data.country == "USA" %}selected{% endif %}>
            USA
          </option>

          <option value="UK"
            {% if data.country == "UK" %}selected{% endif %}>
            UK
          </option>

          <option value="Other"
            {% if data.country == "Other" %}selected{% endif %}>
            Other
          </option>

        </select>

      </div>

      <!-- LINKEDIN -->

      <div class="form-group">

        <label>LinkedIn URL</label>

        <input type="url"
               name="linkedin_url"
               value="{{ data.linkedin_url }}">

      </div>

      <!-- PORTFOLIO -->

      <div class="form-group">

        <label>GitHub / Portfolio URL</label>

        <input type="url"
               name="portfolio_url"
               value="{{ data.portfolio_url }}">

      </div>

      <!-- COVER LETTER -->

      <div class="form-group">

        <label>Cover Letter</label>

        <textarea name="cover_letter">
{{ data.cover_letter }}
        </textarea>

      </div>

      <!-- RESUME -->

      <div class="form-group">

        <label>Resume Upload (PDF only)</label>

        <input type="file"
               name="myfile"
               accept=".pdf,application/pdf"
               {% if not data %}required{% endif %}>

      </div>

      <button type="submit"
              class="btn-primary">

        Submit Application

      </button>

    </form>
