{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'loginStyle.css' %}">
</head>
<body>

  <div class="login-container">
    <h2>Welcome Back</h2>

    <form method="POST" action="{% url 'login_view' %}">
      {% csrf_token %}
      
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" name="password" placeholder="Enter your password" required>
          <span id="togglePassword" class="toggle-password-icon">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </span>
        </div>
      </div>

      <button type="submit">Sign In</button>

      {% if error %}
        <p id="error">{{ error }}</p>
      {% endif %}
    </form>
  </div>

  <script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const eyeIcon = document.querySelector('#eyeIcon');

    togglePassword.addEventListener('click', function () {
        // Toggle the type attribute between text and password
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        
        // Toggle the eye / eye-slash class icons
        if (type === 'text') {
            eyeIcon.classList.remove('fa-regular', 'fa-eye');
            eyeIcon.classList.add('fa-solid', 'fa-eye-slash');
        } else {
            eyeIcon.classList.remove('fa-solid', 'fa-eye-slash');
            eyeIcon.classList.add('fa-regular', 'fa-eye');
        }
    });
  </script>
</body>
</html>
