{% extends "master.html" %}
{% load static %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'form.css' %}">
{% endblock %}
{% block title %}
User Data Form
{% endblock %}

{% block content %}

<div class="form-wrapper">
  <div class="form-card">
  <h2>User Data AJAX Form</h2>

  <form id="userForm" method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" required>
    </div>

    <div class="form-group">
      <label>Gender</label>
      <div class="inline">
        <label><input type="radio" name="gender" value="Male" required> Male</label>
        <label><input type="radio" name="gender" value="Female"> Female</label>
        <label><input type="radio" name="gender" value="Other"> Other</label>
      </div>
    </div>

    <div class="form-group">
      <label>Skills</label>
      <div class="inline">
        <label><input type="checkbox" name="skills" value="HTML"> HTML</label>
        <label><input type="checkbox" name="skills" value="CSS"> CSS</label>
        <label><input type="checkbox" name="skills" value="JS"> JS</label>
      </div>
    </div>

    <div class="form-group">
      <label>Country</label>
      <select name="country">
        <option>India</option>
        <option>USA</option>
        <option>UK</option>
        <option>Other</option>
      </select>
    </div>

    <div class="form-group">
      <label>Message</label>
      <textarea name="message"></textarea>
    </div>

    <div class="form-group">
      <label>File Upload</label>
      <input type="file" name="myfile" accept=".pdf,application/pdf" required>
    </div>

    <button type="submit" name="save_btn" class="btn-primary">Save</button>

  </form>

  <p id="msg"></p>

 
  {% if messages %}
    {% for message in messages %}
      <p class="msg-success">{{ message }}</p>
    {% endfor %}
  {% endif %}

</div>
</div>

{% endblock %}

<script>

document.getElementById("userForm").addEventListener("submit", function(e){

    e.preventDefault();

    const formData = new FormData(this);

    fetch("", {
        method: "POST",
        body: formData
    })

    .then(response => response.json())

    .then(data => {

        document.getElementById("msg").innerHTML = data.message;

        document.getElementById("userForm").reset();

    })

    .catch(error => {
        console.log(error);
    });

});

</script>
