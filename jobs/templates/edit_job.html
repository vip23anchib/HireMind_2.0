{% extends "master.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet"
      href="{% static 'create_job.css' %}">
{% endblock %}

{% block content %}

<div class="form-page-wrapper">
    
    <div class="dark-header-plane">
        <div class="header-container">
            <div class="back-nav">
                <a href="{% url 'manage_jobs' %}">← Back to Manage Jobs</a>
            </div>

            <div>
                <h1 class="form-header-title">Edit Job Opening</h1>
                <p class="form-header-subtitle">Modify the details and technical criteria for this hiring requisition.</p>
            </div>
        </div>
    </div>

    <div class="workspace-body">
        <div class="form-card">
            <form method="POST">
                {% csrf_token %}

                <div class="form-grid-2">
                    <div class="form-field-group">
                        <label for="id_title">Job Title</label>
                        <input type="text" id="id_title" name="title" value="{{ job.title }}" required>
                    </div>
                    <div class="form-field-group">
                        <label for="id_slug">URL Slug</label>
                        <input type="text" id="id_slug" name="slug" value="{{ job.slug }}" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field-group">
                        <label for="id_department">Department</label>
                        <input type="text" id="id_department" name="department" value="{{ job.department }}" required>
                    </div>
                    <div class="form-field-group">
                        <label for="id_location">Location</label>
                        <input type="text" id="id_location" name="location" value="{{ job.location }}" required>
                    </div>
                </div>

                <div class="form-grid-2">
                    <div class="form-field-group">
                        <label for="id_job_type">Job Type</label>
                        <select id="id_job_type" name="job_type">
                            <option value="Full Time" {% if job.job_type == "Full Time" %}selected{% endif %}>Full Time</option>
                            <option value="Internship" {% if job.job_type == "Internship" %}selected{% endif %}>Internship</option>
                            <option value="Contract" {% if job.job_type == "Contract" %}selected{% endif %}>Contract</option>
                        </select>
                    </div>
                    <div class="form-field-group">
                        <label for="id_experience">Experience Required (Years)</label>
                        <input type="number" id="id_experience" name="experience_required" min="0" value="{{ job.experience_required }}" required>
                    </div>
                </div>

                <div class="form-field-group">
                    <label for="id_description">Job Description</label>
                    <textarea id="id_description" name="description">{{ job.description }}</textarea>
                </div>

                <div class="form-field-group">
                    <label for="id_requirements">Requirements</label>
                    <textarea id="id_requirements" name="requirements">{{ job.requirements }}</textarea>
                </div>

                <div class="form-field-group">
                    <label for="id_responsibilities">Responsibilities</label>
                    <textarea id="id_responsibilities" name="responsibilities">{{ job.responsibilities }}</textarea>
                </div>

                <div class="form-actions-wrapper">
                    <a href="{% url 'manage_jobs' %}" class="btn-cancel-job">Cancel</a>
                    <button type="submit" class="btn-submit-job">Update Job</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
