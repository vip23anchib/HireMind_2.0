version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: hiremind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hiremind}
      POSTGRES_USER: ${POSTGRES_USER:-hiremind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hiremind_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hiremind_user} -d ${POSTGRES_DB:-hiremind}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Broker & Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hiremind_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Django Backend Application (DRF & Gunicorn)
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiremind_backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: my_project.settings.production
      SECRET_KEY: ${SECRET_KEY:-django-insecure-production-super-secret-key-hiremind-2026}
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://${POSTGRES_USER:-hiremind_user}:${POSTGRES_PASSWORD:-hiremind_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-hiremind}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py loaddata sqlite_backup.json || true &&
             gunicorn my_project.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - static_data:/app/productionfiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Celery Asynchronous Background Worker
  # ----------------------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiremind_celery
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: my_project.settings.production
      SECRET_KEY: ${SECRET_KEY:-django-insecure-production-super-secret-key-hiremind-2026}
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-hiremind_user}:${POSTGRES_PASSWORD:-hiremind_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-hiremind}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    command: celery -A my_project worker --loglevel=info --concurrency=2
    volumes:
      - media_data:/app/media
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Nginx Gateway & Reverse Proxy
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: hiremind_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/productionfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_data:
  static_data:
