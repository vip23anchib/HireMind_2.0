{% extends "master.html" %}
{% load static %}

{% block title %}
Add Members
{% endblock %}

{% block extra_css %}
<style>
  .card {
    background: white;
    padding: 30px;
    width: 420px;
    border-radius: 12px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.1);
    margin: 60px auto;
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
    color: #333;
  }

  label {
    display: block;
    margin-top: 12px;
    margin-bottom: 5px;
    font-size: 14px;
    color: #555;
  }

  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    outline: none;
  }

  input:focus {
    border-color: #007bff;
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  button:hover {
    background: #218838;
  }
</style>
{% endblock %}

{% block content %}

<div class="card">
  <h1>Add Member</h1>

  <form method="POST">
    {% csrf_token %}

    <label>First Name</label>
    {{ form.firstname }}

    <label>Last Name</label>
    {{ form.lastname }}

    <label>Phone</label>
    {{ form.phone }}

    <label>Joined Date</label>
    {{ form.joined_date }}

    <button type="submit">Add Member</button>
  </form>
</div>

{% endblock %}
