      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateSearchResponse'
          description: ''
  /api/v1/search/matches/:
    get:
      operationId: v1_search_matches_retrieve
