  /api/v1/search/candidates/:
    get:
      operationId: v1_search_candidates_retrieve
      description: Search candidates by skills with boolean AND/OR operator and experience
        threshold.
      parameters:
      - in: query
        name: experience
        schema:
          type: integer
        description: Minimum experience in years
      - in: query
        name: search_type
        schema:
          type: string
        description: 'Search operator: "or" (default) or "and"'
