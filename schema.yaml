          type: integer
        description: Candidate ID
        required: true
      - in: query
        name: job_id
        schema:
          type: integer
        description: Job vacancy ID
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateJobMatchResponse'
          description: ''
